<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="calc-outer-body">
        <div class="calc-display"></div>
        <div class="calc-buttons-panel">
            <div class="btnsrow">
                <div class="button" id="clearbtn">CLR</div>
                <div class="button"></div>
                <div class="button" id="backspace"><<</div>
                <div class="button operate" id="divop">/</div>
            </div>
            <div class="btnsrow">
                <div class="button digit" id="d7">7</div>
                <div class="button digit" id="d8">8</div>
                <div class="button digit" id="d9">9</div>
                <div class="button operate" id="mulop">*</div>
            </div>
            <div class="btnsrow">
                <div class="button digit" id="d4">4</div>
                <div class="button digit" id="d5">5</div>
                <div class="button digit" id="d6">6</div>
                <div class="button operate" id="subop">-</div>
            </div>
            <div class="btnsrow">
                <div class="button digit" id="d1">1</div>
                <div class="button digit" id="d2">2</div>
                <div class="button digit" id="d3">3</div>
                <div class="button operate" id="addop">+</div>
            </div>
            <div class="btnsrow">
                <div class="button"></div>
                <div class="button digit" id="d0">0</div>
                <div class="button digit" style="font-size: 48px;" id="ddot">.</div>
                <div class="button" id="equalbtn">=</div>
            </div>
        </div>
    </div>
</body>
</html>
